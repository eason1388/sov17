<head>

  <meta property="og:description" content="道教修持、符法觀念、氣機陰陽、內煉與玄門觀念文章整理。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://eason1388.github.io/sov17/blog.html" />
  <meta property="og:site_name" content="隨緣堂" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#fbf6ee;
      --bg2:#f4efe6;
      --ink:#1f2a44;
      --muted:#5b667f;
      --line:rgba(31,42,68,.12);
      --gold:#b18a2a;
      --gold2:#d9b45a;
      --teal:#1f8f95;
      --card:#ffffff;
      --shadow:0 18px 50px rgba(31,42,68,.10);
      --radius:22px;
      --max:1120px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Noto Sans TC",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(31,143,149,.10), transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(177,138,42,.10), transparent 45%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 72%, var(--bg) 100%);
      line-height:1.85;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    .wrap{width:min(var(--max), calc(100% - 40px)); margin:0 auto}

    .topbar{position:sticky; top:0; z-index:40; background:rgba(251,246,238,.86); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
    .nav{display:flex; align-items:center; justify-content:space-between; padding:14px 0; gap:18px}
    .brand{display:flex; flex-direction:column; font-family:"Noto Serif TC",serif; font-weight:900; letter-spacing:.14em; color:var(--gold); font-size:1.55rem; line-height:1.15}
    .brand small{font-family:"Noto Sans TC",sans-serif; font-weight:600; letter-spacing:.32em; font-size:.72rem; color:var(--teal); margin-top:4px}
    .navlinks{display:flex; gap:18px; align-items:center; flex-wrap:wrap}
    .navlinks a{color:rgba(31,42,68,.82); font-weight:700; font-size:.96rem}
    .navlinks a:hover{color:var(--teal)}
    .cta{padding:10px 16px; border-radius:999px; border:1px solid rgba(31,143,149,.30); background:rgba(31,143,149,.08); color:var(--teal) !important; font-weight:900}

    header.hero{padding:58px 0 22px}
    .kicker{display:inline-flex; align-items:center; gap:10px; padding:8px 14px; border:1px solid rgba(177,138,42,.25); background:rgba(255,255,255,.55); border-radius:999px; color:var(--gold); letter-spacing:.18em; font-size:.82rem; font-weight:900}
    h1{font-family:"Noto Serif TC",serif; font-weight:900; font-size:clamp(2.0rem, 4.6vw, 3.0rem); line-height:1.25; margin:16px 0 10px; letter-spacing:.08em}
    .sub{color:rgba(31,42,68,.72); max-width:48rem; margin:0}

    .toolbar{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:22px 0 12px}
    .search{flex:1; min-width:240px; display:flex; gap:10px; align-items:center; background:rgba(255,255,255,.72); border:1px solid var(--line); border-radius:999px; padding:10px 14px; box-shadow:var(--shadow)}
    .search input{border:0; outline:none; background:transparent; width:100%; font:inherit; color:rgba(31,42,68,.9)}
    .filters{display:flex; gap:10px; flex-wrap:wrap}
    .chip{border:1px solid rgba(31,42,68,.14); background:rgba(255,255,255,.68); padding:8px 12px; border-radius:999px; font-weight:900; color:rgba(31,42,68,.78); cursor:pointer}
    .chip.active{border-color:rgba(31,143,149,.30); background:rgba(31,143,149,.08); color:var(--teal)}

    .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:10px 0 42px}
    .card{background:rgba(255,255,255,.74); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 18px; transition:transform .25s ease, box-shadow .25s ease}
    .card:hover{transform:translateY(-3px); box-shadow:0 22px 60px rgba(31,42,68,.14)}
    .meta{display:flex; gap:10px; flex-wrap:wrap; align-items:center; color:rgba(31,42,68,.62); font-size:.88rem}
    .pill{display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; border:1px solid rgba(177,138,42,.20); color:var(--gold); background:rgba(255,255,255,.65); font-weight:900; letter-spacing:.10em; font-size:.76rem}
    .card h2{margin:10px 0 8px; font-family:"Noto Serif TC",serif; letter-spacing:.06em; line-height:1.4; font-size:1.22rem}
    .excerpt{margin:0; color:rgba(31,42,68,.74)}
    .tags{margin-top:12px; display:flex; flex-wrap:wrap; gap:8px}
    .tag{font-size:.78rem; color:rgba(31,42,68,.62); border:1px solid rgba(31,42,68,.12); background:rgba(255,255,255,.62); padding:4px 10px; border-radius:999px}

    footer{padding:22px 0 50px; color:rgba(31,42,68,.66); text-align:center}
    .footer-links{display:flex; justify-content:center; gap:12px 18px; flex-wrap:wrap; margin-bottom:10px}

    @media (max-width:980px){.grid{grid-template-columns:1fr}}
    @media (max-width:820px){.navlinks{gap:12px; font-size:.92rem}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <nav class="nav">
        <a class="brand" href="index.html">隨緣堂<small>SUI YUAN TANG</small></a>
        <div class="navlinks">
          <a href="index.html#channels">修行方向</a>
          <a href="blog.html">道法專欄</a>
          <a href="yinfu-zhuanlan.html">陰符經專欄</a>
          <a href="taiyi.html">太乙金華宗旨</a>
          <a class="cta" href="index.html#consult">線上諮詢</a>
        </div>
      </nav>
    </div>
  </div>

  <main class="wrap">
    <header class="hero">
      <div class="kicker">✦ 文章總覽　可搜尋可篩選 ✦</div>
      <h1>道法專欄</h1>
      <p class="sub">你原本的文章都在，只是換成更像部落格的閱讀節奏：先找主題，再慢慢讀深。</p>

      <div class="toolbar">
        <div class="search" role="search">
          <span style="font-weight:900;color:rgba(31,42,68,.55)">搜尋</span>
          <input id="q" type="search" placeholder="輸入關鍵字：符法、養氣、回光、齋戒…" autocomplete="off" />
        </div>
        <div class="filters" aria-label="欄位篩選">
          <button class="chip active" type="button" data-col="道法">道法</button>
          <button class="chip" type="button" data-col="全部">全部</button>
        </div>
      </div>
    </header>

    <section>
      <div class="grid" id="grid" aria-live="polite"></div>
    </section>

    <footer>
      <div class="footer-links">
        <a href="index.html">首頁</a>
        <a href="yinfu-zhuanlan.html">陰符經專欄</a>
        <a href="taiyi.html">太乙金華宗旨</a>
      </div>
      <div>隨緣堂 Sui Yuan Tang</div>
    </footer>
  </main>

  <script>
    var items=[];
    var activeCol='道法';

    function escapeHtml(s){
      return s.replace(/[&<>"']/g,function(c){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]);
      });
    }
    function escapeAttr(s){return String(s).replace(/"/g,'&quot;');}

    function matchesQuery(item, q){
      if(!q) return true;
      q=q.toLowerCase();
      var hay=[item.title,item.excerpt,(item.tags||[]).join(' ')].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    }

    function render(){
      var q=document.getElementById('q').value.trim();
      var grid=document.getElementById('grid');
      var filtered=items
        .filter(function(x){
          if(!x||!x.url) return false;
          if(activeCol!=='全部' && String(x.column||'')!==activeCol) return false;
          return matchesQuery(x,q);
        })
        .sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});

      grid.innerHTML = filtered.map(function(x){
        var tags=(x.tags||[]).slice(0,6).map(function(t){return '<span class="tag">'+escapeHtml(String(t))+'</span>';}).join('');
        return (
          '<a class="card" href="'+escapeAttr(x.url)+'">'
+           '<div class="meta"><span class="pill">'+escapeHtml(String(x.column||'專欄'))+'</span><span>'+escapeHtml(String(x.date||''))+'</span></div>'
+           '<h2>'+escapeHtml(String(x.title||''))+'</h2>'
+           '<p class="excerpt">'+escapeHtml(String(x.excerpt||''))+'</p>'
+           '<div class="tags">'+tags+'</div>'
+         '</a>'
        );
      }).join('');

      if(filtered.length===0){
        grid.innerHTML = '<div class="card"><div class="meta"><span class="pill">查無結果</span></div><h2>沒有符合的文章</h2><p class="excerpt">請換個關鍵字，或切換「全部」。</p></div>';
      }
    }

    function setActiveChip(col){
      activeCol=col;
      document.querySelectorAll('.chip').forEach(function(btn){
        btn.classList.toggle('active', btn.getAttribute('data-col')===col);
      });
      render();
    }

    (function(){
      document.getElementById('q').addEventListener('input', function(){
        window.clearTimeout(window.__qTimer);
        window.__qTimer = window.setTimeout(render, 80);
      });

      document.querySelectorAll('.chip').forEach(function(btn){
        btn.addEventListener('click', function(){
          setActiveChip(btn.getAttribute('data-col'));
        });
      });

      fetch('articles.json', {cache:'no-store'})
        .then(function(r){return r.json();})
        .then(function(data){items=data||[]; render();})
        .catch(function(){
          document.getElementById('grid').innerHTML = '<div class="card"><div class="meta"><span class="pill">錯誤</span></div><h2>文章載入失敗</h2><p class="excerpt">請稍後再試。</p></div>';
        });
    })();
  </script>
</body>
</html>
