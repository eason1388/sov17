<html lang="zh-TW">
<head>

  <meta name="description" content="整理媒體報導中的玄學生活情境，提供以道教符科與修持為主的處理思路：先養氣守神，再檢核命理，必要時以符科對症。" />

  <style>
    :root{
      --bg:#fbf6ee;
      --bg2:#f4efe6;
      --ink:#1f2a44;
      --muted:#5b667f;
      --line:rgba(31,42,68,.12);
      --gold:#b18a2a;
      --teal:#1f8f95;
      --card:#ffffff;
      --shadow:0 18px 50px rgba(31,42,68,.10);
      --shadow2:0 26px 80px rgba(31,42,68,.14);
      --radius:22px;
      --max:1120px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Noto Sans TC",sans-serif;
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      background:
        radial-gradient(circle at 12% 10%, rgba(31,143,149,.10), transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(177,138,42,.10), transparent 45%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 72%, var(--bg) 100%);
      line-height:1.9;
      font-size:18px;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    .wrap{width:min(var(--max), calc(100% - 40px)); margin:0 auto}
    .topbar{position:sticky; top:0; z-index:40; background:rgba(251,246,238,.86); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
    .nav{display:flex; align-items:center; justify-content:space-between; padding:14px 0; gap:18px}
    .brand{display:flex; flex-direction:column; font-family:"Noto Serif TC",serif; font-weight:900; letter-spacing:.14em; color:var(--gold); font-size:1.55rem; line-height:1.15}
    .brand small{font-family:"Noto Sans TC",sans-serif; font-weight:600; letter-spacing:.32em; font-size:.72rem; color:var(--teal); margin-top:4px}
    .navlinks{display:flex; gap:18px; align-items:center; flex-wrap:wrap}
    .navlinks a{color:rgba(31,42,68,.82); font-weight:700; font-size:.96rem}
    .navlinks a:hover{color:var(--teal)}
    .cta{padding:10px 16px; border-radius:999px; border:1px solid rgba(31,143,149,.30); background:rgba(31,143,149,.08); color:var(--teal) !important; font-weight:900}
    .hamburger{display:none; border:0; background:transparent; padding:10px; border-radius:12px}
    .hamburger span{display:block; width:22px; height:2px; background:rgba(31,42,68,.7); margin:5px 0; border-radius:999px}

    header.hero{padding:56px 0 18px}
    .kicker{display:inline-flex; align-items:center; gap:10px; padding:8px 14px; border:1px solid rgba(177,138,42,.25); background:rgba(255,255,255,.55); border-radius:999px; color:var(--gold); letter-spacing:.18em; font-size:.82rem; font-weight:900}
    h1{font-family:"Noto Serif TC",serif; font-weight:900; font-size:clamp(2.1rem, 4.6vw, 3.2rem); line-height:1.18; margin:16px 0 10px; letter-spacing:.10em}
    .sub{color:rgba(31,42,68,.72); max-width:84ch; margin:0}
    .note{
      margin-top:14px;
      background:rgba(255,255,255,.72);
      border:1px solid var(--line);
      border-radius:calc(var(--radius) + 6px);
      box-shadow:var(--shadow);
      padding:14px 16px;
      color:rgba(31,42,68,.78);
      font-size:.98rem;
    }

    .layout{display:grid; grid-template-columns:1fr 360px; gap:22px; padding:18px 0 56px; align-items:start}
    .content{min-width:0}
    .sidebar{position:sticky; top:86px; display:grid; gap:14px}
    .sidebox{background:rgba(255,255,255,.72); border:1px solid var(--line); border-radius:calc(var(--radius) + 6px); box-shadow:var(--shadow2); padding:16px}
    .sidebox h3{margin:0 0 10px; font-family:"Noto Serif TC",serif; letter-spacing:.10em}

    .search{display:flex; gap:10px; align-items:center}
    .search input{
      width:100%;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 12px;
      background:rgba(255,255,255,.9);
      font-size:1rem;
      outline:none;
    }
    .pillrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
    .pill{
      border:1px solid var(--line);
      background:rgba(255,255,255,.9);
      border-radius:999px;
      padding:7px 10px;
      font-weight:800;
      font-size:.88rem;
      color:rgba(31,42,68,.78);
      cursor:pointer;
      user-select:none;
    }
    .pill[data-on="1"]{border-color:rgba(31,143,149,.35); background:rgba(31,143,149,.10); color:var(--teal)}

    .grid{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px}
    .card{
      background:rgba(255,255,255,.78);
      border:1px solid var(--line);
      border-radius:calc(var(--radius) + 6px);
      box-shadow:var(--shadow);
      padding:16px 16px 14px;
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute; inset:-40px -80px auto auto;
      width:220px; height:220px;
      background:radial-gradient(circle at 30% 30%, rgba(31,143,149,.18), transparent 55%);
      transform:rotate(18deg);
      pointer-events:none;
    }
    .title{margin:0 0 8px; font-family:"Noto Serif TC",serif; letter-spacing:.08em; font-weight:900; font-size:1.22rem}
    .label{display:inline-flex; align-items:center; gap:8px; font-weight:900; color:rgba(31,42,68,.72); letter-spacing:.12em; font-size:.78rem; margin:12px 0 6px}
    .txt{margin:0; color:rgba(31,42,68,.78)}
    .tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
    .tag{font-size:.82rem; border:1px solid var(--line); padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.9); color:rgba(31,42,68,.72); font-weight:800}
    .src{
      margin-top:12px; padding-top:12px;
      border-top:1px dashed rgba(31,42,68,.16);
      display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
      color:rgba(31,42,68,.62);
      font-size:.92rem;
    }
    .src a{color:var(--teal); font-weight:900}
    .src a:hover{text-decoration:underline}

    .empty{
      padding:22px;
      border:1px dashed rgba(31,42,68,.18);
      border-radius:calc(var(--radius) + 6px);
      background:rgba(255,255,255,.62);
      color:rgba(31,42,68,.72);
      text-align:center;
    }

    footer{padding:34px 0 48px; border-top:1px solid var(--line); background:rgba(255,255,255,.35)}
    .footgrid{display:flex; gap:16px; justify-content:space-between; flex-wrap:wrap}
    .footgrid a{color:rgba(31,42,68,.76); font-weight:800}
    .footgrid a:hover{color:var(--teal)}

    @media (max-width: 980px){
      .layout{grid-template-columns:1fr}
      .sidebar{position:relative; top:auto}
      .grid{grid-template-columns:1fr}
    }
    @media (max-width: 820px){
      .navlinks{display:none}
      .hamburger{display:block}
      .nav.open .navlinks{display:flex; position:absolute; left:0; right:0; top:64px; padding:12px 20px 16px; background:rgba(251,246,238,.95); border-bottom:1px solid var(--line)}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <div class="nav" id="nav">
        <a href="index.html" class="brand" aria-label="隨緣堂首頁">隨緣堂<small>SUI YUAN TANG</small></a>
        <button class="hamburger" id="hamburger" aria-label="開啟導覽">
          <span></span><span></span><span></span>
        </button>
        <div class="navlinks" id="navlinks">
          <a href="daofa.html">道法專欄</a>
          <a href="yinfu-zhuanlan.html">陰符經專欄</a>
          <a href="taiyi.html">太乙金華宗旨</a>
          <a href="faq.html">常見問題</a>
          <a class="cta" href="index.html#consult">線上諮詢</a>
        </div>
      </div>
    </div>
  </div>

  <header class="hero">
    <div class="wrap">
      <div class="kicker">玄門實錄｜生活情境</div>
      <h1>玄學遇到現實：情境與處理脈絡</h1>
      <p class="sub">本頁以媒體報導中的常見情境為線索，整理出更「可落地」的處理順序：先養氣守神，再檢核命理行運，最後才用道教符科（淨宅、鎮宅符、安神收驚、解關、補財庫等）做對症介入。</p>
      <div class="note">
        <strong>提醒：</strong>每則為摘要整理，不重製原文；涉及健康/法律/投資等高風險議題，仍以醫療與專業程序為準，符科的角色是安神扶正、清障立界。
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="layout">
      <div class="content">
        <div class="grid" id="grid" aria-live="polite"></div>
        <div class="empty" id="empty" style="display:none;">找不到符合的案例，試試看清除關鍵字或取消標籤。</div>
      </div>
      <aside class="sidebar">
        <div class="sidebox">
          <h3>搜尋</h3>
          <div class="search">
            <input id="q" type="search" placeholder="輸入關鍵字（例：淨宅、收驚、口舌、補財庫…）" />
          </div>
          <div class="pillrow" id="pills"></div>
        </div>
        <div class="sidebox">
          <h3>資料來源</h3>
          <p class="txt" id="about"></p>
          <p class="txt" style="margin-top:10px; color:rgba(31,42,68,.62); font-size:.92rem;">
            更新日期：<span id="updated">—</span>
          </p>
        </div>
      </aside>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div class="footgrid">
        <div style="color:rgba(31,42,68,.62); font-weight:800;">© 隨緣堂</div>
        <div style="display:flex; gap:14px; flex-wrap:wrap;">
          <a href="index.html">首頁</a>
          <a href="daofa.html">道法專欄</a>
          <a href="faq.html">常見問題</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    (function(){
      var nav = document.getElementById('nav');
      var hamburger = document.getElementById('hamburger');
      hamburger && hamburger.addEventListener('click', function(){
        nav.classList.toggle('open');
      });

      var state = { q:'', tags:new Set() };
      var all = [];
      var allTags = [];

      function el(tag, attrs, children){
        var node = document.createElement(tag);
        if(attrs){
          Object.keys(attrs).forEach(function(k){
            if(k === 'class') node.className = attrs[k];
            else if(k === 'html') node.innerHTML = attrs[k];
            else node.setAttribute(k, attrs[k]);
          });
        }
        (children || []).forEach(function(c){
          if(typeof c === 'string') node.appendChild(document.createTextNode(c));
          else if(c) node.appendChild(c);
        });
        return node;
      }

      function norm(s){
        return String(s||'').toLowerCase().replace(/\s+/g,'').trim();
      }

      function matches(item){
        var q = norm(state.q);
        if(q){
          var hay = norm(item.title + ' ' + item.situation + ' ' + item.daoist + ' ' + (item.tags||[]).join(' '));
          if(hay.indexOf(q) === -1) return false;
        }
        if(state.tags.size){
          for(var t of state.tags){
            if(!(item.tags||[]).includes(t)) return false;
          }
        }
        return true;
      }

      function render(){
        var grid = document.getElementById('grid');
        var empty = document.getElementById('empty');
        grid.innerHTML = '';
        var shown = 0;
        all.forEach(function(item){
          if(!matches(item)) return;
          shown++;

          var tagEls = (item.tags||[]).map(function(t){ return el('span', {class:'tag'}, [t]); });
          var srcRight = el('div', {}, [
            item.sourceUrl ? el('a', {href:item.sourceUrl, target:'_blank', rel:'noopener'}, ['閱讀報導']) : el('span', {}, ['—'])
          ]);

          grid.appendChild(el('article', {class:'card'}, [
            el('h2', {class:'title'}, [item.title]),
            el('div', {class:'label'}, ['現實情況']),
            el('p', {class:'txt'}, [item.situation]),
            el('div', {class:'label'}, ['道教處理脈絡']),
            el('p', {class:'txt'}, [item.daoist]),
            el('div', {class:'tags'}, tagEls),
            el('div', {class:'src'}, [
              el('div', {}, [ (item.sourceDate ? (item.sourceDate + '｜') : '') + (item.sourceTitle || '來源') ]),
              srcRight
            ])
          ]));
        });
        empty.style.display = shown ? 'none' : 'block';
      }

      function renderPills(){
        var box = document.getElementById('pills');
        box.innerHTML = '';
        allTags.forEach(function(t){
          var p = el('button', {class:'pill', type:'button', 'data-on': state.tags.has(t) ? '1' : '0'}, [t]);
          p.addEventListener('click', function(){
            if(state.tags.has(t)) state.tags.delete(t);
            else state.tags.add(t);
            renderPills();
            render();
          });
          box.appendChild(p);
        });
      }

      function init(){
        var q = document.getElementById('q');
        q && q.addEventListener('input', function(){
          state.q = q.value || '';
          render();
        });
        fetch('xuanxue-life.json', {cache:'no-store'})
          .then(function(r){ return r.json(); })
          .then(function(data){
            document.getElementById('about').textContent = data.about || '';
            document.getElementById('updated').textContent = data.updated || '';
            all = (data.items || []).slice();
            var set = new Set();
            all.forEach(function(it){ (it.tags||[]).forEach(function(t){ set.add(t); }); });
            allTags = Array.from(set).sort(function(a,b){ return a.localeCompare(b, 'zh-Hant'); });
            renderPills();
            render();
          })
          .catch(function(){
            document.getElementById('about').textContent = '資料載入失敗。';
          });
      }

      init();
    })();
  </script>
</body>
</html>
